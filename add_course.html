<main>
    <section>
        <h2>Add New Course</h2>
        <form class="form1" action="" method="post">
            <div>
                <label>Course Name:</label>
                <input type="text" placeholder="Enter a Course Name" required>
            </div>
            <div>
                <label>Instructor:</label>
                <input type="text" placeholder="Enter an Instructor" required>
            </div>
            <div>
                <label>Credit Hour:</label>
                <input type="text" placeholder="Enter a Credit Hour" required>
            </div>
            <div>
                <label>Notes:</label>
                <input class="e" type="text" placeholder="Enter a note" required>
            </div>    
            <input class="m" type="submit" value="Add Course">    
        </form>
    </section>
</main>
